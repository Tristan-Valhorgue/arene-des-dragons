<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Arène des Dragons">
<meta name="theme-color" content="#120c24">
<title>Arène des Dragons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: épique et joueur, combat d'arène.
   IDEA: quatre décors naturels (volcan, glacier, forêt ancienne, îles célestes) autour d'une dalle runique.
   PICTURE: l'arène 3D plein écran, dix dragons de styles différents qui se battent.
   COLOUR and TYPE: pierre violette nocturne, bleu contre orange, or pour le tour actif. Anton + Inter.
   LAYOUT: scène plein écran, bandeau de tour en haut, barre d'actions en bas, étiquettes de PV au-dessus des têtes. */
:root{color-scheme:dark;--ink:#fff6ec;--muted:#d9d0f2;--t0:#5b95ff;--t1:#ff8048;--gold:#ffd166;--panel:rgba(16,10,32,.72);--line:rgba(255,255,255,.13)}
*{box-sizing:border-box;min-width:0}
body{margin:0;color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;min-height:calc(var(--vh)*100);
 background:repeating-radial-gradient(ellipse at 50% 118%,transparent 0 46px,rgba(0,0,0,.17) 46px 50px,transparent 50px 56px),radial-gradient(ellipse at 50% 0%,#4a3a7a,#2a1f4d 55%,#120c24);background-attachment:fixed}
body.battle{overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;display:none}
body.battle #gl{display:block}
h1,h2,h3{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.01em;line-height:1.05;margin:0}
button{font:inherit;color:inherit}
.btn{border:0;border-radius:12px;padding:12px 18px;min-height:44px;background:var(--gold);color:#1c1238;font-weight:800;cursor:pointer}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.big{font-size:18px;padding:14px 24px}
.btn:focus-visible,.ab:focus-visible,[role=button]:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.c0{color:var(--t0)}.c1{color:var(--t1)}
.por svg{display:block;width:100%;height:100%;border-radius:50%}
.poster{max-width:900px;margin:0 auto;padding:clamp(20px,calc(var(--vw)*4),48px) max(calc(var(--vw)*4),16px) 48px;text-align:center}
.hemi{position:relative;aspect-ratio:2/1;width:min(760px,100%);margin:0 auto}
.seat{position:absolute;width:clamp(48px,calc(var(--vw)*11),92px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;box-shadow:0 8px 18px rgba(0,0,0,.45),0 0 0 3px rgba(255,255,255,.85)}
.ttl{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:62%}
.ttl h1{font-size:clamp(40px,calc(var(--vw)*9),92px);text-shadow:0 4px 0 #120c24}
.ttl span{display:block;font-family:Inter;font-weight:800;font-size:clamp(14px,calc(var(--vw)*2.2),20px);color:var(--gold);margin-top:6px}
.lead{font-size:17px;max-width:56ch;margin:22px auto;color:var(--muted)}
.names{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:end}
.names label{display:grid;gap:4px;text-align:left;font-size:14px;font-weight:600}
.names input{font:16px Inter;padding:11px 12px;border-radius:10px;border:2px solid transparent;background:#fff6ec;color:#2a0509;width:200px}
.names label:nth-child(1) input{border-color:var(--t0)}.names label:nth-child(2) input{border-color:var(--t1)}
.envs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:18px;font-size:14px;font-weight:600}.chip{border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:99px;padding:9px 16px;min-height:44px;cursor:pointer;font-weight:600}.chip.on{background:var(--gold);color:#1c1238;border-color:var(--gold)}
.rules{list-style:none;padding:0;margin:28px auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;text-align:left;font-size:14px;color:var(--muted)}
.rules li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.top{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:10px max(calc(var(--vw)*2),12px);position:sticky;top:0;z-index:5;background:rgba(20,12,40,.85);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
body.battle .top{position:fixed;left:0;right:0}
.turn{font-size:17px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.08)}
.turn.t0{box-shadow:inset 0 0 0 2px var(--t0)}.turn.t1{box-shadow:inset 0 0 0 2px var(--t1)}
.turn small{color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.roster{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:14px}
.mini{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--panel)}
.mini b{margin-right:6px}.mini.t0 b{color:var(--t0)}.mini.t1 b{color:var(--t1)}
.slot{width:40px;height:40px;border-radius:50%;border:2px dashed var(--line);display:block}
.mini.t0 .slot:not(:empty){border:2px solid var(--t0)}.mini.t1 .slot:not(:empty){border:2px solid var(--t1)}
.slot svg{width:100%;height:100%;border-radius:50%;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px;padding:4px max(calc(var(--vw)*2),12px) 40px;max-width:1500px;margin:0 auto}
.dcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;transition:transform .15s,border-color .15s}
.dcard:hover{transform:translateY(-3px);border-color:var(--gold)}
.dcard.taken{opacity:.42;cursor:default;transform:none}
.dcard.taken.t0{border-color:var(--t0)}.dcard.taken.t1{border-color:var(--t1)}
.dtop{display:flex;gap:12px;align-items:center}
.dtop .por{width:78px;height:78px;flex:none}
.nm{display:block;font-size:17px}.rl{display:block;font-size:13px;color:var(--muted)}
.cls{display:inline-block;margin-top:4px;font-size:13px;padding:1px 8px;border-radius:99px;background:rgba(255,209,102,.16);color:var(--gold)}
.stats{display:grid;gap:3px;margin:12px 0 8px}
.st{display:grid;grid-template-columns:34px 1fr 40px;align-items:center;gap:8px;font-size:13px}
.st em{font-style:normal;color:var(--muted)}.st b{text-align:right}
.st i{height:6px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}.st u{display:block;height:100%;background:var(--gold)}
.dcard dl{margin:0;font-size:13px}.dcard dt{font-weight:800;margin-top:7px}.dcard dt small{font-weight:600;color:var(--gold)}
.dcard dd{margin:1px 0 0;color:var(--muted)}
.owner{position:absolute;top:12px;right:12px;font-size:13px;font-weight:800;background:#000a;padding:2px 8px;border-radius:99px}
/* combat 3D */
.order{display:flex;gap:5px;align-items:center}
.o{width:30px;height:30px;border-radius:50%;display:block;flex:none}.o svg{width:100%;height:100%;border-radius:50%;display:block}
.o.t0{box-shadow:0 0 0 2px var(--t0)}.o.t1{box-shadow:0 0 0 2px var(--t1)}
.o.now{width:42px;height:42px;box-shadow:0 0 0 3px var(--gold)}
.logbox{position:fixed;left:50%;top:74px;transform:translateX(-50%);z-index:4;list-style:none;margin:0;padding:6px 14px;width:min(560px,calc(var(--vw)*94));font-size:13px;text-align:center;color:var(--muted);background:rgba(16,10,32,.6);border-radius:12px;pointer-events:none}
.logbox li:first-child{color:var(--ink);font-weight:600}
#hud{position:fixed;inset:0;z-index:3;pointer-events:none}
.lb{position:absolute;left:0;top:0;width:114px;padding:4px 6px 5px;border-radius:9px;background:rgba(14,9,28,.8);border:1.5px solid var(--line);pointer-events:auto;will-change:transform}
.lb.t0{border-color:var(--t0)}.lb.t1{border-color:var(--t1)}
.lb.active{border-color:var(--gold);box-shadow:0 0 14px rgba(255,209,102,.55)}
.lb.tg{cursor:pointer;border-color:#fff;animation:pulse 1s ease-in-out infinite}
.lb.dead{opacity:.5;width:auto}
.lb b{display:block;font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .row{display:flex;justify-content:space-between;gap:6px;font-size:13px;font-weight:800}.lb .row span{flex:none}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,255,255,.6)}}
.hp{position:relative;height:8px;border-radius:9px;background:rgba(0,0,0,.6);overflow:hidden;margin:3px 0 2px}
.hp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#7cf2a3,#2fbf6a);transition:width .4s}
.hp s{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(45deg,#fff9,#fff9 3px,#fff4 3px,#fff4 6px)}
.tmb{height:3px;border-radius:9px;background:rgba(0,0,0,.5);overflow:hidden}.tmb i{display:block;height:100%;background:var(--gold);transition:width .4s}
.effs{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.ef{font-size:11px;font-weight:800;padding:0 5px;border-radius:5px;cursor:help}
.ef.buff{background:#1f7a49;color:#d8ffe8}.ef.debuff{background:#9b1c34;color:#ffe0e6}
#hud.flat{position:static;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:150px 12px 220px;pointer-events:auto}
#hud.flat .lb{position:static;width:auto;transform:none!important}
.act{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:8px 18px;align-items:center;padding:10px max(calc(var(--vw)*2),12px);background:rgba(16,10,32,.9);backdrop-filter:blur(6px);border-top:3px solid var(--gold)}
.act.t0{border-top-color:var(--t0)}.act.t1{border-top-color:var(--t1)}
.who{display:flex;gap:10px;align-items:center}.who .por{width:50px;height:50px;flex:none}
.who b{display:block;font-size:16px}.who small{display:block;font-size:13px;color:var(--muted);line-height:1.35}
.abs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ab{text-align:left;border:2px solid var(--line);background:rgba(255,255,255,.07);border-radius:12px;padding:8px 12px;cursor:pointer;min-height:44px}
.ab b{display:block;font-size:15px}.ab b small{font-weight:600;color:var(--gold);margin-left:6px}
.ab span{display:block;font-size:13px;color:var(--muted);line-height:1.3}
.ab.on{border-color:var(--gold);background:rgba(255,209,102,.14)}
.ab:disabled{opacity:.4;cursor:not-allowed}
.hint{grid-column:1/-1;margin:0;font-size:14px;font-weight:600;color:var(--gold);text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
.pop{position:absolute;font:800 20px Inter;white-space:nowrap;text-shadow:0 2px 4px #000,0 0 8px #000;animation:rise 1.4s ease-out forwards;opacity:0}
.pop.dmg{color:#fff}.pop.crit{color:var(--gold);font-size:26px}.pop.heal{color:#7cf2a3}.pop.buff{color:#9ff0c2;font-size:14px}.pop.debuff{color:#ff9db0;font-size:14px}.pop.info{color:#cfe0ff;font-size:14px}
@keyframes rise{0%{opacity:0;transform:translateY(8px) scale(.7)}15%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-46px)}}
.cast{position:absolute;left:50%;top:20%;font:400 clamp(30px,calc(var(--vw)*6),66px) Anton,Impact,sans-serif;white-space:nowrap;text-shadow:0 4px 0 #1c0308,0 0 26px #000;animation:cast 1.4s ease-out forwards}
@keyframes cast{0%{opacity:0;transform:translateX(-50%) scale(1.7)}14%{opacity:1;transform:translateX(-50%) scale(1)}75%{opacity:1;transform:translateX(-50%) scale(1.04)}100%{opacity:0;transform:translateX(-50%) scale(1.1)}}
.flash{position:absolute;inset:0;background:#fff;animation:fl .28s forwards}@keyframes fl{from{opacity:.5}to{opacity:0}}
.end{position:fixed;inset:0;z-index:30;display:grid;place-items:end center;padding:16px 16px calc(var(--vh)*12);pointer-events:none}
.endbox{max-width:520px;text-align:center;background:rgba(40,26,80,.94);border-radius:20px;padding:22px 26px;border:3px solid var(--gold);pointer-events:auto}
.endbox.t0{border-color:var(--t0)}.endbox.t1{border-color:var(--t1)}
.endbox h2{font-size:clamp(28px,calc(var(--vw)*6),44px);margin:4px 0}.endbox p{color:var(--muted);margin:6px 0}
.endbox .rowb{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
:where(html.w900) .act{grid-template-columns:minmax(0,1fr)}:where(html.w900) .who small{display:none}:where(html.w900) .order .o:nth-child(n+6){display:none}:where(html.w900) .logbox{top:118px}
:where(html.w520) .turn{font-size:15px}:where(html.w520) .lb{width:66px;padding:3px 4px}:where(html.w520) .lb:not(.dead):not(.active) .row b{display:none}:where(html.w520) .lb.dead b{font-size:11px}:where(html.w520) .effs{display:none}
@media(prefers-reduced-motion:reduce){.pop{animation:none;opacity:1}.lb.tg{animation:none}}
/* --- menus, progression, ultime --- */
.por img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
.por{display:block;border-radius:50%;box-shadow:0 0 0 2px #b8c0cc}.por.rR{box-shadow:0 0 0 2px #5b95ff}.por.rE{box-shadow:0 0 0 2px #c77dff}.por.rL{box-shadow:0 0 0 3px #ffb347}
.logo{font-size:clamp(44px,calc(var(--vw)*9),96px);text-shadow:0 4px 0 #120c24;margin-top:8px}
.heroes{display:flex;gap:14px;justify-content:center;margin:18px 0 8px}.heroes .por{width:clamp(70px,calc(var(--vw)*14),120px);height:clamp(70px,calc(var(--vw)*14),120px)}
.res{display:flex;gap:10px;align-items:center;font-weight:800;font-size:14px}.res span{background:rgba(255,255,255,.1);padding:6px 12px;border-radius:99px;white-space:nowrap}
.res .gold{color:var(--gold)}.res.big{justify-content:center;font-size:16px;margin:10px 0 18px}
.ttl2{font:400 22px Anton,Impact,sans-serif;margin-left:6px}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:720px;margin:0 auto}
.mbtn{text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:16px 18px;cursor:pointer;min-height:44px;transition:transform .15s,border-color .15s}
.mbtn:hover{transform:translateY(-2px);border-color:var(--gold)}.mbtn b{display:block;font:400 24px Anton,Impact,sans-serif}.mbtn span{display:block;font-size:14px;color:var(--muted)}
.mbtn.main{grid-column:1/-1;background:linear-gradient(120deg,#6a3fd0,#c0392b);border-color:transparent}.mbtn.main span{color:#fff}
.mbtn.hot{border-color:var(--gold);box-shadow:0 0 18px rgba(255,209,102,.35)}
.el{display:inline-block;font-size:12px;font-weight:800;padding:0 8px;border-radius:99px;background:color-mix(in srgb,var(--e) 26%,transparent);color:var(--e);border:1px solid var(--e)}
.rar{font-size:12px;font-weight:800}
.stars{color:var(--gold);letter-spacing:1px}.stars i{font-style:normal;opacity:.25}
.dcard.rR{border-color:rgba(91,149,255,.55)}.dcard.rE{border-color:rgba(199,125,255,.6)}.dcard.rL{border-color:rgba(255,179,71,.75);box-shadow:0 0 16px rgba(255,179,71,.18)}
.dcard{cursor:default}.dcard.pickable{cursor:pointer}.dcard:not(.pickable):hover{transform:none}
.dcard.locked{opacity:.55}.dcard.locked .por{filter:grayscale(1) brightness(.6)}
.dcard details{font-size:13px;margin-top:6px}.dcard summary{cursor:pointer;font-weight:800;padding:6px 0;color:var(--gold)}
.dcard .btn{width:100%;margin-top:10px}.btn:disabled{opacity:.4;cursor:not-allowed}
.lv{margin:10px 0 0;font-size:15px}.lockt{margin:10px 0 0;font-size:13px;color:var(--muted)}
.camp{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;padding:16px max(calc(var(--vw)*2),12px) 40px;max-width:1200px;margin:0 auto}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-content:start}
.stg{aspect-ratio:1;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-weight:800;font-size:16px;cursor:pointer}
.stg.done{background:rgba(63,174,90,.3);border-color:#3fae5a}.stg.boss{border-radius:50%;border-color:var(--gold);color:var(--gold)}.stg.on{outline:3px solid #fff;outline-offset:2px}.stg:disabled{opacity:.3;cursor:not-allowed}
.stagebox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.stagebox h2{font-size:32px}.stagebox h3{font-size:20px;margin:18px 0 8px}.stagebox h3 small{font:600 13px Inter;color:var(--muted);margin-left:8px}
.sub{color:var(--muted);font-size:14px;margin:4px 0 12px}.rew{font-size:14px;margin:12px 0 0}
.foes{display:flex;flex-wrap:wrap;gap:14px}.foe{display:grid;justify-items:center;gap:3px;font-size:13px}.foe .por{width:64px;height:64px}.foe.big .por{width:92px;height:92px}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pk{display:grid;justify-items:center;gap:2px;width:92px;padding:8px 4px;border-radius:12px;border:2px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;font-size:12px;opacity:.6}
.pk .por{width:54px;height:54px}.pk.on{opacity:1;border-color:var(--gold);background:rgba(255,209,102,.12)}.pk b{font-size:13px}.pk small{color:var(--muted)}
.chests{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding:24px max(calc(var(--vw)*2),12px);max-width:1000px;margin:0 auto}
.chestc{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center}.chestc h3{font-size:22px;margin-top:12px}.odds{font-size:13px;color:var(--muted)}
.chest{position:relative;width:110px;height:80px;margin:14px auto 0;border-radius:10px;background:linear-gradient(color-mix(in srgb,var(--c) 85%,#000),color-mix(in srgb,var(--c) 55%,#000));box-shadow:inset 0 0 0 4px rgba(0,0,0,.25),0 8px 18px rgba(0,0,0,.4)}
.chest::before{content:"";position:absolute;left:-4px;right:-4px;top:-22px;height:34px;border-radius:40px 40px 6px 6px;background:var(--c);box-shadow:inset 0 0 0 4px rgba(0,0,0,.22)}
.chest i{position:absolute;left:50%;top:2px;width:20px;height:26px;margin-left:-10px;border-radius:5px;background:#2a1f10;box-shadow:inset 0 0 0 3px #ffd166}
.chest.sm{width:50px;height:36px;margin:8px 0 0;flex:none}.chest.sm::before{top:-11px;height:17px}.chest.sm i{width:10px;height:13px;margin-left:-5px}
.end.on{pointer-events:auto;background:rgba(8,5,18,.75);place-items:center;padding:16px}
.loot{display:grid;gap:10px;margin:14px 0;text-align:left}
.lt{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;opacity:0;animation:lt .45s ease-out forwards}
.lt .por{width:52px;height:52px;flex:none}.lt small{display:block;color:var(--muted)}.lt.new{box-shadow:inset 0 0 0 2px var(--gold)}
.coin{width:40px;height:40px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffd166 45%,#b8860b);box-shadow:inset 0 0 0 3px rgba(0,0,0,.18)}
@keyframes lt{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
.endbox{min-width:min(420px,calc(var(--vw)*92))}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;box-shadow:0 0 0 1.5px rgba(255,255,255,.7)}
.enb{height:3px;border-radius:9px;background:rgba(0,0,0,.5);overflow:hidden;margin-top:2px}.enb i{display:block;height:100%;background:#c77dff;transition:width .4s}
.lb.rdy .enb i{background:#fff;box-shadow:0 0 6px #c77dff}.lb.rdy{box-shadow:0 0 12px rgba(199,125,255,.7)}
.ab.ult{border-color:rgba(199,125,255,.5)}.ab.ult.rdy{border-color:#c77dff;background:linear-gradient(120deg,rgba(199,125,255,.35),rgba(255,107,53,.3));animation:rdy 1.2s ease-in-out infinite}
.ab.ult.rdy b small{color:#fff}
@keyframes rdy{50%{box-shadow:0 0 18px rgba(199,125,255,.8)}}
.who .por{box-shadow:none}
.pop.eff{color:#ffe14d;font-size:15px}
body.battle::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.45))}

:where(html.rot body:not(.battle):not(.viewer) #app>*){overflow-x:clip;max-width:100%}
html.rot .worlds,html.rot .topan{overflow:auto}
.fsb{display:inline-flex;align-items:center;gap:7px}.fsb svg{flex:none}.fsb.ico{padding:8px 11px}
.fsov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:14px;background:rgba(8,5,18,.8);pointer-events:auto}
.fsbox{width:min(440px,100%);max-height:100%;overflow:auto;text-align:center;background:rgba(40,26,80,.97);border:2px solid var(--gold);border-radius:18px;padding:18px 20px}
.fsbox h2{font-size:28px;margin:0 0 6px}.fsbox p{margin:0 0 14px;color:var(--muted);font-size:14px;overflow-wrap:anywhere}.fsbox p b{color:var(--ink)}
.fsbox .rowb{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.p2p{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.sub.bad{color:#ff9d8a;font-weight:700}
/* écran peu haut : téléphone à l'horizontale */
html.short .top{padding:4px 10px;gap:6px;flex-wrap:nowrap}
html.short .turn{font-size:13px;padding:4px 11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.short .tools{flex-wrap:nowrap;gap:5px;flex:none}
html.short .top .btn{padding:4px 10px;font-size:12px;min-height:34px;border-radius:9px}
html.short .ttl2{font-size:15px;white-space:nowrap}
html.short .res span{font-size:12px;padding:3px 9px}
html.short .logbox{top:46px;font-size:11px;padding:3px 12px;width:min(430px,56%)}
html.short .logbox li:nth-child(n+2){display:none}
html.short .act{grid-template-columns:auto minmax(0,1fr);gap:3px 10px;padding:5px 10px 6px;border-top-width:2px}
html.short .abs{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:6px}
html.short .ab{position:relative;padding:5px 10px;min-height:40px}
html.short .ab b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.short .ab.on span{position:absolute;left:0;right:0;bottom:calc(100% + 7px);padding:6px 9px;border-radius:10px;border:1px solid var(--line);background:rgba(16,10,32,.95);font-size:12px;pointer-events:none}
html.short .who .por{width:36px;height:36px}
html.short .who b{font-size:13px;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.short .hint{font-size:11px;line-height:1.25}
html.short .lb{width:64px!important;padding:2px 4px 3px}
html.short .lb b,html.short .lb .row{font-size:11px}
html.short .lb:not(.dead):not(.active):not(.sel) .row b{display:none}
html.short .lb:not(.dead):not(.active):not(.sel) .row{justify-content:center}
html.short .lb.active,html.short .lb.sel{width:92px!important;z-index:3}
html.short .lb .effs{gap:2px;margin-top:2px}
html.short .lb .ef{font-size:10px!important;padding:0 3px!important}
html.short .lb.giant{top:44px!important;width:min(300px,38%)!important;padding:5px 9px}
html.short .lb.giant .row b{font-size:15px}html.short .lb.giant .row span{font-size:12px}html.short .lb.giant .hp{height:10px}
html.short .topan{top:44px;bottom:62px;width:132px;padding:7px 8px 10px;gap:6px}
html.short .tobtn{top:36%;padding:8px 5px}html.short .tobtn.on{right:132px}
html.short .tor .por{width:28px;height:28px}html.short .tor{font-size:11px}
html.short .endbox{padding:12px 16px;max-height:calc(var(--zh) - 16px);overflow:auto}
html.short .endbox h2{font-size:26px}
html.short .hubtop{padding:6px 12px 16px;align-items:center}
html.short .hubtop .logo{font-size:24px;white-space:nowrap}
html.short .hubres{gap:5px;flex-wrap:nowrap}
html.short .hubres span{font-size:12px;padding:3px 9px}
html.short .hubl{inset:46px auto 56px 10px;width:min(330px,42%);display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:center;padding:0}
html.short .hl{position:static;white-space:normal;padding:6px 8px 7px}
html.short .hl::after{display:none}
html.short .hl.main{grid-column:1/-1;padding:7px 10px 8px}
html.short .hl b{font-size:15px}html.short .hl.main b{font-size:19px}
html.short .hl span{font-size:11px;line-height:1.2}
html.short .hubbar{flex-wrap:nowrap;gap:6px;padding:14px 10px 8px}
html.short .hubbar .btn{padding:6px 11px;font-size:13px;min-height:38px}
html.short .hubbar .hubhint{display:none}
html.short .hubtoast{bottom:54px;font-size:12px;padding:6px 14px;max-width:calc(var(--zw) - 20px)}
html.short .hrules .rules{position:fixed;left:8px;right:8px;bottom:54px;width:auto;max-height:calc(var(--zh) - 110px);overflow:auto}
html.short .fiche{top:43px;left:auto;right:0;bottom:0;width:min(340px,44%);max-height:none;border-top:0;border-left:1px solid var(--line);padding:10px 12px 14px}
html.short .fiche h2{font-size:22px}
html.short .worlds{top:43px;right:min(340px,44%);padding:6px 8px;gap:6px}
html.short .worlds .chip{padding:5px 10px;font-size:13px}
html.short .draghint{display:none}
</style>
